name: gestor_de_estoque
description: "Aplicativo mobile do Arara-Gastos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  go_router: ^17.2.3
  lucide_icons_flutter: ^3.1.14+2
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  shadcn_ui: ^0.56.3
  drift: ^2.34.4
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.6

flutter:
  uses-material-design: true
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrument_sans/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/instrument_sans/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/instrument_sans/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/instrument_sans/InstrumentSans-Bold.ttf
          weight: 700
