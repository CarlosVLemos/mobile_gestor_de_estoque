# MCPs do projeto Arara-Gastos Mobile.
# Segredos devem vir do ambiente/local config; nunca versionar valores reais.

[mcp_servers.dart]
command = "C:\\Users\\carlos.silva\\src\\flutter\\bin\\cache\\dart-sdk\\bin\\dart.exe"
args = ["mcp-server", "--force-roots-fallback"]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

# Developer Knowledge MCP (Google/Flutter/Dart docs).
# Defina GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY no ambiente local.
[mcp_servers.developer-knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
env_http_headers = { X_GOOG_API_KEY = "GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY" }

# O modelo já possui raciocínio próprio; este servidor fica desligado para
# reduzir latência/contexto. Ative somente se uma investigação específica
# demonstrar benefício.
[mcp_servers.sequential-thinking]
command = "C:\\Windows\\System32\\cmd.exe"
args = [
  "/c",
  "C:\\Users\\carlos.silva\\AppData\\Roaming\\nodejs\\npx.cmd",
  "-y",
  "@modelcontextprotocol/server-sequential-thinking",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = false

[mcp_servers.sequential-thinking.env]
DISABLE_THOUGHT_LOGGING = "true"
